<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Event & Workshop Registration</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>
</head>


<body>


<form id="themeForm">

    <div class="themebutton">
        <button type="button" id="themeToggle">
            Change Colour mode
        </button>
    </div>

    <div class="register">
        <button type="button" id="register">
            Register
        </button>
    </div>

    <div class="adminButton">
        <button type="button" id="openAdmin">
            Admin
        </button>
    </div>

</form>



<header class="siteHeader">

    <div class="headerContent">

        <div class="headerText">
            <p class="headerTag">EVENT PLATFORM</p>

            <h1>Event & Workshop Registration</h1>

            <p class="headerDescription">
                Discover upcoming events, workshops and activities.
            </p>
        </div>

        <div class="headerImage">
            <img
                src="source/img/conference-organisers.jpg"
                alt="Event and Workshop"
            >
        </div>

    </div>

</header>



<!-- SEARCH -->

<form id="searchForm">

    <div class="label">

        <h2>Search for Events</h2>


        <label for="search">
            Search:
        </label>

        <input
            type="text"
            id="search"
            name="search"
        >


        <br>


        <label for="category">
            Category:
        </label>

        <select id="category" name="category">

            <option value="all">
                All
            </option>

            <option value="Tech">
                Tech
            </option>

            <option value="Design">
                Design
            </option>

            <option value="Business">
                Business
            </option>

            <option value="General">
                General
            </option>

        </select>


        <br>


        <label for="date">
            Date:
        </label>

        <input
            type="date"
            id="date"
            name="date"
        >


        <br>


        <button type="reset">
            Reset
        </button>

        <button type="submit">
            Search
        </button>

    </div>

</form>



<!-- EVENT INFORMATION -->

<div class="information">

    <h2>Event Information</h2>

    <p>
        Here you can find information about upcoming events and workshops.
    </p>


    <br>


    <label for="sort">
        Sort By:
    </label>

    <select id="sort">

        <option value="none">
            None
        </option>

        <option value="date">
            Date
        </option>

        <option value="seats">
            Seats
        </option>

    </select>


    <br>


    <div class="information details">

        <br>

        <div id="eventList"></div>

        <br>

    </div>

</div>


<!-- ADMIN LOGIN POPUP -->

<div id="adminModal" class="modal">

    <div class="loginpopup">

        <button
            type="button"
            id="closeAdmin"
            class="closebutton"
        >
            ×
        </button>

        <h2>Admin Login</h2>
        <h6>No Need for inputs JUST PLASE CONFRIM</h6>
        <label for="username">
            Username:
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

        <label for="password">
            Password:
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button type="button" id="adminLoginButton">
            Login
        </button>

    </div>

</div>

</body>

</html>
